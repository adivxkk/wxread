name: wxread

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

on:
  schedule:
    # 凌晨任务：北京时间每天 01:00（UTC 前一天 17:00）
    # - cron: '0 17 * * *'
    # 早间任务：北京时间每天 05:00（UTC 前一天 21:00）
    #- cron: '0 21 * * *'
    # 每天北京时间 10:00 触发一次；任务内随机延迟后在 10:00–16:00 间执行。
    # GitHub Actions 的 cron 使用 UTC，北京时间 10:00 对应 UTC 02:00。
    - cron: '0 2 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Wait for a random execution time
      id: random-wait
      shell: bash
      run: |
        # 在北京时间 10:00–16:00（左闭右开）内随机选择执行时刻。
        window_start=$(TZ=Asia/Shanghai date -d 'today 10:00' +%s)
        window_end=$(TZ=Asia/Shanghai date -d 'today 16:00' +%s)
        now=$(date +%s)

        # 若启动时已超过窗口，跳过部署，避免在指定时间外执行。
        if ((now >= window_end)); then
          echo "Current time: $(TZ=Asia/Shanghai date -d "@$now" '+%F %T %Z')"
          echo "The execution window has passed; skipping this run."
          echo 'should_run=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # GitHub 调度可能延迟。随机区间从“窗口开始”和“当前时刻”中较晚者开始，
        # 确保不会选到已过去的随机时刻。
        random_start=$now
        if ((random_start < window_start)); then
          random_start=$window_start
        fi

        random_offset=$(((RANDOM << 15 | RANDOM) % (window_end - random_start)))
        target_time=$((random_start + random_offset))
        delay_seconds=$((target_time - now))

        echo "Current time: $(TZ=Asia/Shanghai date -d "@$now" '+%F %T %Z')"
        echo "Target time:  $(TZ=Asia/Shanghai date -d "@$target_time" '+%F %T %Z')"
        echo "Waiting ${delay_seconds} seconds before running the deployment script."
        echo 'should_run=true' >> "$GITHUB_OUTPUT"

        if ((delay_seconds > 0)); then
          sleep "$delay_seconds"
        fi

    - name: Run deployment script
      if: steps.random-wait.outputs.should_run == 'true'
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables

      run: |
        python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
