name: wxread

on:
  workflow_dispatch:  # 手动触发，仅用于冒烟测试

jobs:
  smoke:
    runs-on: ubuntu-22.04
    environment: AutoRead

    steps:
      - name: Set DNS to Google's DNS
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

      - name: Run one-request smoke test
        env:
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          READ_NUM: '1-1'  # config.py 按 "下限-上限" 解析
        run: python main.py
